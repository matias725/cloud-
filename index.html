<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Cloud - AWS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-img-top.custom-card-img { height: 220px; object-fit: cover; transition: transform 0.3s ease; }
        .custom-card:hover .custom-card-img { transform: scale(1.05); }
        .custom-card { transition: box-shadow 0.3s ease; border: none; }
        .custom-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important; }
        .form-label { font-weight: 600; color: #495057; }
        .btn-primary { background-color: #007bff; border: none; font-weight: 600; padding: 10px 20px; }
        .btn-primary:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-5 py-3">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fs-3 fw-bold"><i class="bi bi-cloud-arrow-up-fill me-2"></i> Plataforma de Gestión Cloud - AWS</span>
        <button id="btnLogout" class="btn btn-outline-light btn-sm" style="display: none;" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
    </div>
</nav>

<div id="auth-section" class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 mb-4">
                <div class="card-body p-5">
                    <h4 class="text-center mb-4 fw-bold" id="authTitle">Iniciar Sesión</h4>
                    <form id="authForm">
                        <div id="nameGroup" class="mb-3" style="display: none;">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="authName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" id="authEmail" class="form-control" required placeholder="usuario@demo.cl">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="authPassword" class="form-control" required placeholder="User1234">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill mb-3 shadow-sm" id="btnAuthSubmit">Entrar</button>
                        <p class="text-center mb-0 small">
                            <a href="#" id="toggleAuthBtn" class="text-decoration-none" onclick="toggleAuthMode()">¿No tienes cuenta? Regístrate aquí</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container" id="app-section" style="display: none;">
    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white py-3 rounded-top-4">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-camera-fill me-2"></i>Subir Nueva Foto</h5>
                </div>
                <div class="card-body p-4">
                    <form id="uploadForm" method="POST" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Título de la Imagen</label>
                            <input type="text" class="form-control" id="nombre" name="title" required placeholder="Ej: Paisaje de la Patagonia">
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="description" rows="3" required placeholder="Breve historia de la foto..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="imagen" class="form-label">Archivo de Imagen (S3)</label>
                            <input class="form-control" type="file" id="imagen" name="image" accept="image/*" required onchange="previewImage(event)">
                            <div class="text-center mt-3">
                                <img id="preview" class="img-fluid rounded shadow-sm" style="display: none; max-height: 200px; object-fit: cover;">
                            </div>
                        </div>

                        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 rounded-pill shadow-sm"><i class="bi bi-cloud-upload me-2"></i>Guardar en AWS S3</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0 text-secondary fw-bold"><i class="bi bi-images me-2"></i>Galería Cloud</h3>
                <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fetchPhotos()"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
            </div>
            <div class="row" id="contenedor-galeria">
                
                <!-- Las tarjetas se insertarán dinámicamente aquí mediante JavaScript -->
            </div>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // --- Integración con el Backend Node.js ---
    const API_URL = 'http://alb-evaluacion-cloud-2081490226.us-east-1.elb.amazonaws.com/api';

    // Lógica de Autenticación
    let isLoginMode = true;

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? 'Iniciar Sesión' : 'Registrarse';
        document.getElementById('nameGroup').style.display = isLoginMode ? 'none' : 'block';
        document.getElementById('authName').required = !isLoginMode;
        document.getElementById('btnAuthSubmit').innerText = isLoginMode ? 'Entrar' : 'Registrar';
        document.getElementById('toggleAuthBtn').innerText = isLoginMode ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const name = document.getElementById('authName').value;

        const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
        const body = isLoginMode ? { email, password } : { name, email, password };

        try {
            const res = await fetch(`${API_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            
            if (res.ok && data.success) {
                localStorage.setItem('jwtToken', data.data.token);
                checkAuth();
            } else {
                alert(data.message || 'Error en la autenticación');
            }
        } catch (error) {
            alert('Error de conexión con el backend en AWS.');
        }
    });

    function checkAuth() {
        const token = localStorage.getItem('jwtToken');
        if (token) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('btnLogout').style.display = 'inline-block';
            fetchPhotos(); // Cargar la galería protegida
        } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('jwtToken');
        checkAuth();
    }

    // 1. Interceptar el envío del formulario para incluir el Token JWT y subir la imagen
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const token = localStorage.getItem('jwtToken');
        if (!token) return;

        const formData = new FormData(this);
        const btnSubmit = document.getElementById('btnSubmit');
        const originalText = btnSubmit.innerHTML;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Subiendo...';
        btnSubmit.disabled = true;
        
        try {
            const response = await fetch(this.action, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const result = await response.json();
            
            if (response.ok) {
                alert('¡Foto subida con éxito a tu galería!');
                this.reset();
                document.getElementById('preview').style.display = 'none';
                fetchPhotos(); // Recargar la galería opcionalmente
            } else {
                alert('Error del servidor: ' + (result.message || JSON.stringify(result.errors)));
            }
        } catch (error) {
            alert('Hubo un error de conexión al subir la imagen. Revisa CORS y que tu backend en AWS esté encendido.');
        } finally {
            btnSubmit.innerHTML = originalText;
            btnSubmit.disabled = false;
        }
    });

    // 2. Cargar y renderizar las tarjetas simulando el comportamiento de un mapa (loop)
    async function fetchPhotos() {
        const token = localStorage.getItem('jwtToken');
        if (!token) return;

        try {
            // Cargar las galerías de este usuario autenticado (Endpoint protegido)
            const response = await fetch(`${API_URL}/galleries/my`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            
            if (response.ok && result.data && result.data.galleries) {
                let galleries = result.data.galleries;

                // Lógica mágica: Si es usuario nuevo y no tiene galería, se la creamos por debajo
                if (galleries.length === 0) {
                    const createRes = await fetch(`${API_URL}/galleries`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ title: "Mi Galería Privada", visibility: "private" })
                    });
                    const createData = await createRes.json();
                    if (createData.success) {
                        return fetchPhotos(); // Recargamos tras crearla
                    }
                }

                // Enlazar dinámicamente la URL del formulario hacia SU galería personal
                const userGalleryId = galleries[0].id;
                document.getElementById('uploadForm').action = `${API_URL}/galleries/${userGalleryId}/photos`;

                const container = document.getElementById('contenedor-galeria');
                container.innerHTML = '';
                
                galleries.forEach(gallery => {
                    if (gallery.photos && gallery.photos.length > 0) {
                        gallery.photos.forEach(photo => {
                            const card = `
                                <div class="col-sm-6 mb-3">
                                    <div class="card shadow-sm h-100 custom-card rounded-4 overflow-hidden">
                                        <img src="${photo.imageUrl}" class="card-img-top custom-card-img" alt="${photo.title}">
                                        <div class="card-body">
                                            <h5 class="card-title fw-bold">${photo.title}</h5>
                                            <p class="card-text text-muted small">${photo.description}</p>
                                            <button onclick="deletePhoto(${gallery.id}, ${photo.id})" class="btn btn-sm btn-outline-danger mt-2 w-100"><i class="bi bi-trash"></i> Eliminar</button>
                                        </div>
                                    </div>
                                </div>`;
                            container.insertAdjacentHTML('beforeend', card);
                        });
                    }
                });
            }
        } catch (error) {
            console.error('Error al cargar la galería:', error);
        }
    }

    // 3. Eliminar una foto
    async function deletePhoto(galleryId, photoId) {
        if (!confirm('¿Estás seguro de que deseas eliminar esta imagen permanentemente?')) return;
        
        const token = localStorage.getItem('jwtToken');
        if (!token) return;

        try {
            const response = await fetch(`${API_URL}/galleries/${galleryId}/photos/${photoId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();
            
            if (response.ok) {
                fetchPhotos(); // Refrescar la vista
            } else {
                alert('Error al eliminar: ' + (result.message || JSON.stringify(result.errors)));
            }
        } catch (error) {
            alert('Hubo un error de conexión al intentar eliminar la foto.');
        }
    }

    // Disparar la comprobación de autenticación al cargar la página
    checkAuth();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
